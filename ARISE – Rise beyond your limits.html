<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>ARISE – CA Final Study Quest</title>
<style>
:root{--bg:#0B0D12;--s1:#141722;--s2:#1B2030;--v:#8B5CF6;--b:#38BDF8;--t:#F4F4F5;--m:#A1A1AA;--g:#4ADE80;--w:#FBBF24;--r:#F87171;--bd:#262B3D;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{height:auto;margin:0}body{background:var(--bg);color:var(--t);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}h1,h2,h3{margin:0 0 .5rem}h1{font-size:1.5rem}h2{font-size:1.15rem}h3{font-size:1rem}small,.mu{color:var(--m)}
#app{display:flex;min-height:100vh}nav{width:220px;background:var(--s1);border-right:1px solid var(--bd);padding:16px 10px;position:sticky;top:0;height:100vh;flex-shrink:0}

nav button:hover{background:var(--s2);color:var(--t)}nav button.on{background:linear-gradient(90deg,#8B5CF633,#38BDF81a);color:var(--t);box-shadow:inset 2px 0 var(--v)}
main{flex:1;padding:24px;max-width:1100px;margin:0 auto;width:100%;min-width:0}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.22em;margin:0 8px 18px}.logo svg{width:26px;height:26px}
.card{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}.grid .card{margin:0}
.hero{background:linear-gradient(135deg,#8B5CF626,#38BDF814),var(--s1)}
.bar{height:8px;background:var(--s2);border-radius:99px;overflow:hidden;margin:6px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--v),var(--b));border-radius:99px;transition:width .5s}
.stat b{display:block;font-size:1.4rem}.stat{background:var(--s2);border-radius:10px;padding:10px 12px}
.bt{background:linear-gradient(135deg,var(--v),#6D4AE0);border:0;border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600}.bt:hover{filter:brightness(1.1)}
.g2{background:var(--s2);border:1px solid var(--bd);font-weight:500}.sm{padding:4px 9px;font-size:.8rem}.dn{background:#7f1d1d}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sp{justify-content:space-between}
.tag{font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--s2);border:1px solid var(--bd);color:var(--m)}.tag.ok{color:var(--g)}.tag.wn{color:var(--w)}.tag.er{color:var(--r)}.tag.v{color:var(--b)}
.ch{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--bd)}
select,input,textarea{background:var(--s2);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;width:100%}.ch select{width:auto}
:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button{background:var(--s1);border:1px solid var(--bd);border-radius:99px;padding:5px 13px;cursor:pointer;color:var(--m)}.tabs .on{color:var(--t);border-color:var(--v);background:#8B5CF626}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}.md{background:var(--s1);border:1px solid var(--bd);border-radius:14px;padding:20px;width:100%;max-width:440px;max-height:90vh;overflow:auto}.md label{display:block;margin:8px 0;font-size:.85rem;color:var(--m)}.er{color:var(--r);min-height:1em;margin:4px 0}
#toast{position:fixed;right:16px;top:16px;z-index:99;display:flex;flex-direction:column;gap:8px}#toast div{background:var(--s2);border:1px solid var(--v);border-radius:10px;padding:10px 14px;animation:in .3s}#toast .e{border-color:var(--r)}@keyframes in{from{opacity:0;transform:translateY(-8px)}}
.ach{opacity:.5}.ach.on{opacity:1;border-color:var(--v);animation:in .5s}.ic{font-size:1.6rem}
.empty{text-align:center;padding:28px;color:var(--m);border:1px dashed var(--bd);border-radius:14px}
.ob{max-width:480px;margin:5vh auto;padding:16px}
.tm{position:fixed;right:16px;bottom:16px;z-index:45;background:var(--s1);border:1px solid var(--v);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 0 18px #8B5CF633}.tm b{font-variant-numeric:tabular-nums;color:var(--b);font-size:1.1rem}.lg{display:flex;align-items:center;gap:8px;padding:3px 0}.lg i{width:12px;height:12px;border-radius:3px;flex-shrink:0}.pw{display:flex;gap:20px;align-items:center;flex-wrap:wrap}.pw>div:last-child{flex:1;min-width:200px}
body{background:radial-gradient(900px 520px at 88% -8%,#8B5CF624,transparent),radial-gradient(760px 440px at -8% 108%,#38BDF81f,transparent),var(--bg)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:44px 44px;-webkit-mask-image:radial-gradient(circle at 50% 0,#000,transparent 78%);mask-image:radial-gradient(circle at 50% 0,#000,transparent 78%)}
.card{position:relative;border-color:#2b3150;background:linear-gradient(160deg,#171b2a,#121521)}
.card::before,.card::after{content:"";position:absolute;width:12px;height:12px;pointer-events:none}.card::before{top:-1px;left:-1px;border-top:2px solid var(--v);border-left:2px solid var(--v);border-top-left-radius:14px}.card::after{bottom:-1px;right:-1px;border-bottom:2px solid var(--b);border-right:2px solid var(--b);border-bottom-right-radius:14px}
.bt{box-shadow:0 0 0 1px #ffffff14 inset,0 4px 16px #8B5CF640}.g2,.dn{box-shadow:none}
.bar{background:repeating-linear-gradient(90deg,#1B2030 0 18px,#161a28 18px 20px)}.bar i{position:relative;overflow:hidden}.bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#ffffff40,transparent);animation:sh 2.8s infinite}@keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.logo{letter-spacing:normal;font-weight:400;gap:10px}.logo svg{width:34px;height:37px;overflow:visible}.logo>div{line-height:1}
.wm{display:block;font-weight:900;letter-spacing:.3em;font-size:1.15rem;background:linear-gradient(90deg,#fff,#c4b5fd 55%,#38BDF8);-webkit-background-clip:text;background-clip:text;color:transparent}.mt{display:block;font-size:.5rem;letter-spacing:.2em;color:var(--m);margin-top:5px}
.logo.big{justify-content:center;flex-direction:column;gap:14px;margin:0 0 10px;text-align:center}.logo.big svg{width:92px;height:100px;filter:drop-shadow(0 0 16px #8B5CF699)}.logo.big .wm{font-size:3.2rem;letter-spacing:.34em;margin-right:-.34em}.logo.big .mt{font-size:.7rem;margin-top:10px}
.c1,.c2,.c3{fill:none;stroke:url(#lg);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;animation:rs 2.4s ease-in-out infinite}.c2{animation-delay:.3s}.c3{animation-delay:.6s}@keyframes rs{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-2px)}}
.hex{width:68px;height:76px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(160deg,var(--v),var(--b));display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;color:#fff;line-height:1}.hex b{font-size:1.6rem}.hex small{color:#ffffffcc;font-size:.55rem;letter-spacing:.15em}
.land{max-width:560px;margin:0 auto;padding:6vh 16px 40px;text-align:center}.mot{font-size:clamp(1.9rem,7vw,2.8rem);line-height:1.1;margin:18px 0 12px;background:linear-gradient(90deg,#fff,#c4b5fd 50%,#38BDF8);-webkit-background-clip:text;background-clip:text;color:transparent}.mis{font-size:1.05rem;color:#d4d4d8;margin:0 0 6px}.land .card{text-align:left;margin-top:22px}.feat{margin-top:6px;grid-template-columns:repeat(3,1fr)}.feat div{background:var(--s1);border:1px solid var(--bd);border-radius:10px;padding:10px 6px;font-size:.8rem;color:var(--m)}.feat b{display:block;color:var(--b);font-size:1.2rem}
.rb{display:flex;flex-direction:column;align-items:center;flex-shrink:0;gap:2px}.rb svg{width:86px;height:86px;filter:drop-shadow(0 0 10px #8B5CF644)}.chip{margin-top:-8px;position:relative;background:#141722;border:1px solid #8B5CF68c;color:#c4b5fd;border-radius:99px;padding:1px 10px;font-size:.62rem;font-weight:700;letter-spacing:.14em}.rb small{font-size:.6rem;letter-spacing:.15em;color:var(--m)}
.sy{font-size:.7rem;color:var(--m);padding:14px 12px 0}
.lbr{display:grid;grid-template-columns:40px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--s2);margin-bottom:8px}.lbr.me{outline:1px solid var(--v);background:linear-gradient(90deg,#8B5CF626,var(--s2))}.lbr .bar{margin:4px 0 0;height:5px}
.rk{width:32px;height:36px;display:grid;place-items:center;font-weight:800;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:#262B3D;color:var(--m)}.r1{background:#C2A15A;color:#0B0D12}.r2{background:#9AA5B8;color:#0B0D12}.r3{background:#B0806A;color:#0B0D12}
@media(max-width:760px){.sy,.lbr .tag:nth-of-type(2){display:none}.lbr{grid-template-columns:36px 1fr auto}.lbr .tag:nth-of-type(2){display:inline-block}}
.sw{width:16px;height:16px;border-radius:50%;border:2px solid var(--bd);padding:0;cursor:pointer;flex-shrink:0}.sw:hover{border-color:var(--t)}
@media(max-width:760px){#app{display:block}nav{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;overflow-x:auto;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:40;border-top:1px solid var(--bd);border-right:0}nav button{flex-direction:column;gap:0;font-size:.68rem;width:auto;min-width:62px;padding:6px}.logo{display:none}main{padding:14px 14px 90px}.tm{left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px))}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><div id="toast" aria-live="polite"></div><div id="app"></div>
<script>
/* ARISE MVP — all rules live in CFG / pure helpers. Data: browser localStorage (private to this browser). */
const CFG={xp:{chapter:20,revision:15,test:10,custom:10},base:50,intervals:[1,3,7,14,30],
ranks:[[1,'E-Rank'],[3,'D-Rank'],[5,'C-Rank'],[8,'B-Rank'],[12,'A-Rank'],[16,'S-Rank']]};
const KEY='arise_v1',$=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const p2=n=>String(n).padStart(2,'0'),ymd=d=>d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
const today=()=>ymd(new Date()),P=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const addD=(s,n)=>{const d=P(s);d.setDate(d.getDate()+n);return ymd(d)};
const fmt=s=>P(s).toLocaleDateString(undefined,{day:'numeric',month:'short'});
const weekStart=s=>{const d=P(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)};
let S=null,V='dash',OPEN=null,RT='due',UID=null,DB=null,USER=null,LB=[],LBU=null,ST=null,PENDING=null,TL='streak',WARNED=0,SYNC='local';
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(S){S.sessions=S.sessions||[];S.timer=S.timer||null}
const blank=p=>({profile:p,subjects:[],revs:[],xp:[],started:{},claimed:{},custom:[],tests:[],sessions:[],timer:null,ach:{},days:[]});
function save(){S.savedAt=Date.now();syncSoon();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Could not save — browser storage unavailable. Changes will be lost on reload.',1)}}
function toast(m,e){const d=document.createElement('div');if(e)d.className='e';d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),3800)}
/* ---------- core calculations ---------- */
const chs=()=>S.subjects.flatMap(s=>s.ch);
const findCh=id=>{for(const s of S.subjects){const c=s.ch.find(x=>x.id===id);if(c)return{s,c}}return null};
const pc=(a,b)=>b?Math.round(a/b*100):null;
const total=()=>S.xp.reduce((a,x)=>a+x.amt,0);
const lvlOf=x=>Math.floor(Math.sqrt(x/CFG.base))+1;
const rankOf=l=>{let r=CFG.ranks[0];for(const k of CFG.ranks)if(l>=k[0])r=k;return r};
const nextRank=l=>CFG.ranks.find(k=>k[0]>l);
function lv(){const x=total(),l=lvlOf(x),a=CFG.base*(l-1)**2,b=CFG.base*l*l;return{x,l,in:x-a,need:b-a,pct:Math.round((x-a)/(b-a)*100),rank:rankOf(l)[1]}}
function award(key,amt,label){if(S.xp.some(x=>x.key===key))return 0;S.xp.push({key,amt,label,date:today()});touch();return amt}
function touch(){const t=today();if(!S.days.includes(t))S.days.push(t)}
function streaks(){const d=[...new Set(S.days)].sort();let best=0,run=0,prev=null;for(const x of d){run=prev&&addD(prev,1)===x?run+1:1;best=Math.max(best,run);prev=x}
let cur=0,t=today();if(!d.includes(t))t=addD(t,-1);while(d.includes(t)){cur++;t=addD(t,-1)}return{cur,best}}
const rst=r=>r.done?'done':r.due<today()?'over':r.due===today()?'due':'up';
const doneRevs=cid=>S.revs.filter(r=>r.cid===cid&&r.done);
function subStats(s){const n=s.ch.length,d=s.ch.filter(c=>c.st===2).length,p=s.ch.filter(c=>c.st===1).length;
return{n,d,p,ns:n-d-p,pc:pc(d,n),rv:s.ch.filter(c=>doneRevs(c.id).length).length}}
function overall(){const a=chs();return{n:a.length,d:a.filter(c=>c.st===2).length,pc:pc(a.filter(c=>c.st===2).length,a.length)}}
function attention(){const out=[];for(const s of S.subjects)for(const c of s.ch){const w=[];
if(S.revs.some(r=>r.cid===c.id&&rst(r)==='over'))w.push('Revision overdue');
if(c.conf&&c.conf<=2)w.push('Low self-rated confidence');
if(c.st===2&&!doneRevs(c.id).length)w.push('Studied but never revised');
if(w.length)out.push({c,s,w})}return out}
/* ---------- quests (criteria evaluated from real activity; XP bonus is separate from activity XP) ---------- */
function quests(){const t=today(),wk=weekStart(t),Q=[];const inWk=d=>d&&d>=wk;
const q=(id,cat,title,desc,xp,met,sub)=>Q.push({id,cat,title,desc,xp,met,sub});
q('d-ch:'+t,'Daily','Study a chapter today','Mark any chapter as first study completed today.',15,chs().some(c=>c.studiedOn===t));
q('d-rev:'+t,'Daily','Complete a revision today','Record one completed revision.',15,S.revs.some(r=>r.doneOn===t));
q('w-rev:'+wk,'Weekly','Three revisions this week','Record 3 revisions since Monday.',40,S.revs.filter(r=>inWk(r.doneOn)).length>=3);
q('w-ch:'+wk,'Weekly','Two chapters this week','Complete first study of 2 chapters since Monday.',40,chs().filter(c=>inWk(c.studiedOn)).length>=2);
if(S.revs.some(r=>rst(r)==='over'))q('r-over:'+t,'Revision','Clear all overdue revisions','Complete or reschedule every overdue revision.',30,false);
else if(S.revs.length)q('r-over:'+t,'Revision','Overdue queue clear','No overdue revisions — claim it.',30,true);
chs().filter(c=>c.st===1).slice(0,3).forEach(c=>q('c-'+c.id,'Chapter','Finish: '+c.name,'Move this in-progress chapter to first study completed.',20,false,c.id));
S.subjects.filter(s=>s.ch.length>=3).forEach(s=>q('b-'+s.id,'Boss Battle','Boss: conquer '+s.name,'Complete first study of every chapter in this subject.',100,s.ch.every(c=>c.st===2)));
[5,10,25].forEach(n=>q('m-'+n,'Milestone','Study '+n+' chapters','Reach '+n+' first-study-completed chapters.',n*10,overall().d>=n));
S.custom.forEach(c=>q('x-'+c.id,'Practice',c.title,'Your own quest — mark done manually.',CFG.xp.custom,!!c.done,'x'));
return Q.map(k=>{k.st=S.claimed[k.id]?'done':k.met?'ready':S.started[k.id]?'started':'open';return k})}
/* ---------- achievements ---------- */
const ACH=[['first_quest','First Quest','Claim any quest reward.','⚔',()=>Object.keys(S.claimed).length>=1],
['first_ch','First Chapter','Complete first study of a chapter.','◈',()=>overall().d>=1],
['first_rev','First Revision','Record a completed revision.','↻',()=>S.revs.some(r=>r.done)],
['first_sub','Subject Conquered','Study every chapter of a subject.','▲',()=>S.subjects.some(s=>s.ch.length&&s.ch.every(c=>c.st===2))],
['streak7','Seven-Day Streak','Be active on 7 consecutive days.','✦',()=>streaks().best>=7],
['boss','First Boss Battle','Claim a Boss Battle reward.','♛',()=>Object.keys(S.claimed).some(k=>k.startsWith('b-'))],
['rev10','Revision Milestone','Complete 10 revisions.','⟳',()=>S.revs.filter(r=>r.done).length>=10],
['cons','Consistency','Be active on 14 different days.','◉',()=>new Set(S.days).size>=14]];
function act(fn){const L=lv().l;fn();for(const a of ACH)if(!S.ach[a[0]]&&a[4]()){S.ach[a[0]]=today();toast('Achievement unlocked: '+a[1])}
save();R();const n=lv();if(n.l>L)toast('Level up! You are now level '+n.l+' · '+n.rank)}
/* ---------- forms ---------- */
function form(title,fields,vals,cb,ok='Save'){const m=document.createElement('div');m.className='ov';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');
m.innerHTML=`<form class="md"><h3>${esc(title)}</h3>${fields.map(f=>f.t==='note'?`<p>${esc(f.l)}</p>`:`<label>${esc(f.l)}${f.t==='select'?`<select name="${f.n}">${f.o.map(o=>`<option value="${esc(o[0])}"${String(vals[f.n]??'')===String(o[0])?' selected':''}>${esc(o[1])}</option>`).join('')}</select>`:f.t==='textarea'?`<textarea name="${f.n}" rows="3">${esc(vals[f.n]||'')}</textarea>`:`<input name="${f.n}" type="${f.t||'text'}" value="${esc(vals[f.n]??'')}" ${f.x||''}>`}</label>`).join('')}<p class="er" role="alert"></p><div class="row"><button type="button" class="bt g2" onclick="this.closest('.ov').remove()">Cancel</button><button class="bt">${ok}</button></div></form>`;
m.querySelector('form').onsubmit=e=>{e.preventDefault();const err=cb(Object.fromEntries(new FormData(e.target)));if(err){m.querySelector('.er').textContent=err;return}m.remove()};
document.body.appendChild(m);const f=m.querySelector('input,select,textarea,button');f&&f.focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const o=document.querySelector('.ov');o&&o.remove()}});
const confirmD=(msg,cb)=>form('Please confirm',[{t:'note',l:msg}],{},()=>{cb()},'Confirm');
const opts=a=>a.map((x,i)=>[i,x]);
/* ---------- actions ---------- */
function addSubject(){form('New subject',[{n:'name',l:'Subject name',x:'required maxlength=80'}],{},d=>{if(!d.name.trim())return'Name required';act(()=>S.subjects.push({id:uid(),qual:'final',name:d.name.trim(),ch:[]}))})}
function editSubject(id){const s=S.subjects.find(x=>x.id===id);form('Edit subject',[{n:'name',l:'Name',x:'required maxlength=80'}],s,d=>{if(!d.name.trim())return'Name required';act(()=>s.name=d.name.trim())})}
function delSubject(id){confirmD('Delete this subject, its chapters, revisions and tracked study time?',()=>act(()=>{const s=S.subjects.find(x=>x.id===id);const ids=s.ch.map(c=>c.id);S.revs=S.revs.filter(r=>!ids.includes(r.cid));S.sessions=S.sessions.filter(x=>!ids.includes(x.cid));if(S.timer&&ids.includes(S.timer.cid))S.timer=null;S.subjects=S.subjects.filter(x=>x.id!==id);OPEN=null}))}
function mv(arr,i,d){const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];act(()=>0)}
const CHF=[{n:'name',l:'Chapter name',x:'required maxlength=100'},{n:'desc',l:'Description',t:'textarea'},
{n:'st',l:'Status',t:'select',o:[[0,'Not started'],[1,'In progress'],[2,'First study completed']]},
{n:'pri',l:'Priority',t:'select',o:[['low','Low'],['med','Medium'],['high','High']]},
{n:'conf',l:'Confidence in understanding',t:'select',o:[[0,'Not rated'],[1,'1 – Very low'],[2,'2 – Low'],[3,'3 – OK'],[4,'4 – Good'],[5,'5 – Strong']]},{n:'notes',l:'Notes',t:'textarea'}];
function addChapter(sid){editChapter(null,sid)}
function editChapter(cid,sid){const f=cid?findCh(cid):null,c=f?f.c:{name:'',desc:'',st:0,pri:'med',conf:0,mins:0,notes:''};
form(cid?'Edit chapter':'New chapter',CHF,c,d=>{if(!d.name.trim())return'Name required';
act(()=>{const o=c.id?c:{id:uid(),ch:0};Object.assign(o,{name:d.name.trim(),desc:d.desc,pri:d.pri,conf:+d.conf,notes:d.notes});if(!c.id){o.st=0;S.subjects.find(s=>s.id===sid).ch.push(o)}setSt(o.id,+d.st,1)})})}

const nr=nextRank(L.l),att=attention().slice(0,4),cont=chs().find(c=>c.st===1)||chs().find(c=>c.st===0);
const msg=!o.n?'Your syllabus is empty — add subjects to begin your first quest.':over.length?`${over.length} revision${over.length>1?'s are':' is'} overdue. Clearing one is a strong comeback.`:st.cur>=3?`${st.cur}-day streak. Consistency is compounding.`:o.pc>=50?`You have conquered ${o.pc}% of your syllabus. Keep the revisions flowing.`:'Pick one chapter and finish it today — that is the whole game.';
const qn=n=>{const c=findCh(n.id.slice(2));return c?c.c.name:''};
return`<div class="card hero"><div class="row" style="flex-wrap:nowrap;gap:16px">${rankBadge(L.rank,L.l)}<div><small class="mu">WELCOME BACK</small><h1 style="margin:0">${esc(S.profile.name||'Student')} · ${L.rank}</h1><p class="mu" style="margin:4px 0 0">${msg}</p></div></div>
<div class="row sp"><small>${L.x} XP total</small><small>${L.in}/${L.need} XP to level ${L.l+1}${nr?' · next rank '+nr[1]+' at level '+nr[0]:' · top rank'}</small></div>${bar(L.pct)}</div>
<div class="grid" style="margin-bottom:14px">${[['Syllabus',o.pc==null?'—':o.pc+'%'],['Streak',st.cur+'d'],['Best streak',st.best+'d'],['Quests done',Object.keys(S.claimed).length],['Revisions done',S.revs.filter(r=>r.done).length],['Chapters done',o.d+'/'+o.n]].map(x=>`<div class="stat"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>
<div class="card"><div class="row sp"><h2>Studied today</h2><button class="bt g2 sm" onclick="nav('time')">Study Time</button></div><div class="pw"><div>${pie(tdata,goal>0&&tt?Math.min(100,Math.round(tt/3600/goal*100))+'% of '+goal+'h goal':'studied today')}</div><div>${S.subjects.map(x=>`<div class="lg"><button class="sw" style="background:${subCol(x)}" aria-label="Change colour for ${esc(x.name)}" onclick="pickColor('${x.id}')"></button><span style="flex:1">${esc(x.name)}</span><small>${bySub[x.id]?fmtT(bySub[x.id])+' · '+Math.round(bySub[x.id]/tt*100)+'%':'—'}</small></div>`).join('')}${tt?'':`<p class="mu">Nothing tracked yet today. Start the timer on a chapter and your subjects will fill this ring.</p><button class="bt sm" onclick="nav('time')">Start studying</button>`}<br><small class="mu">Tap a colour dot to change a subject's colour.</small></div></div></div>
<h2>Subject progress</h2>${S.subjects.length?`<div class="grid">${S.subjects.map(s=>{const k=subStats(s);return`<div class="card"><h3>${esc(s.name)}</h3>${bar(k.pc)}<small>${k.pc==null?'No chapters yet':k.pc+'% complete'} · ${k.n} chapters</small><br><small>${k.d} done · ${k.p} in progress · ${k.ns} not started</small><br><small>Revised at least once: ${k.rv}/${k.n}</small><div style="margin-top:8px"><button class="bt sm" onclick="V='syl';OPEN='${s.id}';R()">Open</button></div></div>`}).join('')}</div>`:empty('No subjects yet.',`<button class="bt" onclick="nav('syl')">Set up syllabus</button>`)}
<div class="grid" style="margin-top:14px"><div class="card"><h2>Today's quests</h2>${Q.filter(k=>k.cat==='Daily').map(k=>`<div class="ch"><div><b>${esc(k.title)}</b><br><small>${esc(k.desc)} · +${k.xp} XP</small></div>${k.st==='done'?'<span class="tag ok">Claimed</span>':k.met?`<button class="bt sm" onclick="claim('${k.id}')">Claim</button>`:'<span class="tag">In progress</span>'}</div>`).join('')}<button class="bt g2 sm" style="margin-top:8px" onclick="nav('quests')">All quests</button></div>
<div class="card"><h2>Revision due</h2><div class="row"><span class="tag wn">${due.length} today</span><span class="tag er">${over.length} overdue</span><span class="tag v">${up.length} upcoming</span></div><div style="margin-top:10px"><button class="bt sm" onclick="RT='${over.length?'over':'due'}';nav('rev')">Start a revision</button></div></div>
<div class="card"><h2>Continue studying</h2>${cont?`<b>${esc(cont.name)}</b><br><small>${findCh(cont.id).s.name} · ${cont.st?'In progress':'Next up'}</small><div style="margin-top:8px"><button class="bt sm" onclick="V='syl';OPEN='${findCh(cont.id).s.id}';R()">Open</button></div>`:'<span class="mu">Nothing pending.</span>'}</div>
<div class="card"><h2>Needs attention</h2>${att.length?att.map(a=>`<div><b>${esc(a.c.name)}</b><br><small>${a.w.join(' · ')}</small></div>`).join(''):'<span class="mu">Nothing flagged yet.</span>'}</div></div>
<div class="card"><h2>Recent activity</h2>${S.xp.length?[...S.xp].reverse().slice(0,6).map(x=>`<div class="row sp"><span>${esc(x.label)}</span><small>+${x.amt} XP · ${fmt(x.date)}</small></div>`).join(''):'<span class="mu">Complete a chapter, revision or quest to see activity here.</span>'}</div>`}
function vSyl(){const o=overall();if(OPEN){const s=S.subjects.find(x=>x.id===OPEN);if(!s){OPEN=null}else{const k=subStats(s);return`<button class="bt g2 sm" onclick="OPEN=null;R()">← Subjects</button><h1 style="margin-top:10px">${esc(s.name)}</h1>${bar(k.pc)}<p class="mu">${k.pc==null?'No chapters yet.':k.d+' of '+k.n+' chapters complete ('+k.pc+'%)'}</p><div class="row" style="margin-bottom:8px"><button class="bt" onclick="addChapter('${s.id}')">+ Chapter</button><button class="bt g2" onclick="editSubject('${s.id}')">Rename</button><button class="bt g2" onclick="pickColor('${s.id}')"><span class="sw" style="display:inline-block;vertical-align:middle;background:${subCol(s)}"></span> Colour</button><button class="bt dn" onclick="delSubject('${s.id}')">Delete</button></div>
<div class="card">${s.ch.length?s.ch.map((c,i)=>`<div class="ch"><div style="min-width:180px;flex:1"><b>${esc(c.name)}</b>${c.desc?`<br><small>${esc(c.desc)}</small>`:''}<div class="row" style="margin-top:4px"><span class="tag ${c.pri==='high'?'wn':''}">${c.pri} priority</span><span class="tag">${c.conf?'Confidence '+c.conf+'/5':'Unrated'}</span>${c.studiedOn?`<span class="tag">Studied ${fmt(c.studiedOn)}</span>`:''}${chSecs(c.id)?`<span class="tag v">${fmtT(chSecs(c.id))} tracked</span>`:''}${doneRevs(c.id).length?`<span class="tag ok">${doneRevs(c.id).length} revisions</span>`:''}</div></div>
<select aria-label="Status of ${esc(c.name)}" onchange="setSt('${c.id}',this.value)">${['Not started','In progress','Study completed'].map((n,j)=>`<option value="${j}"${c.st===j?' selected':''}>${n}</option>`).join('')}</select>
<div class="row"><button class="bt g2 sm" aria-label="Move up" onclick="mv(S.subjects.find(x=>x.id==='${s.id}').ch,${i},-1)">↑</button><button class="bt g2 sm" aria-label="Move down" onclick="mv(S.subjects.find(x=>x.id==='${s.id}').ch,${i},1)">↓</button><button class="bt g2 sm" onclick="editChapter('${c.id}')">Edit</button><button class="bt g2 sm" onclick="startTimer('${c.id}')">▶ Timer</button><button class="bt g2 sm" onclick="schedRev('${c.id}')">Revise</button><button class="bt g2 sm" onclick="history('${c.id}')">History</button><button class="bt dn sm" aria-label="Delete chapter" onclick="delChapter('${c.id}')">✕</button></div></div>`).join(''):empty('No chapters in this subject yet.',`<button class="bt" onclick="addChapter('${s.id}')">Add first chapter</button>`)}</div>`}}
return`<h1>My Syllabus</h1><p class="mu">Completion = chapters with first study completed ÷ total chapters. Revision and mastery are tracked separately. Sample content is editable and <b>not</b> the official ICAI syllabus.</p>
<div class="card row sp"><div><b>${o.pc==null?'No chapters yet':o.pc+'% overall'}</b><br><small>${o.d}/${o.n} chapters</small></div><div class="row"><button class="bt" onclick="addSubject()">+ Subject</button></div></div>
${S.subjects.length?`<div class="grid">${S.subjects.map((s,i)=>{const k=subStats(s);return`<div class="card"><h3>${esc(s.name)}</h3>${bar(k.pc)}<small>${k.n} chapters · ${k.pc==null?'—':k.pc+'%'}</small><div class="row" style="margin-top:8px"><button class="sw" style="background:${subCol(s)}" aria-label="Change colour for ${esc(s.name)}" onclick="pickColor('${s.id}')"></button><button class="bt sm" onclick="OPEN='${s.id}';R()">Open</button><button class="bt g2 sm" aria-label="Move up" onclick="mv(S.subjects,${i},-1)">↑</button><button class="bt g2 sm" aria-label="Move down" onclick="mv(S.subjects,${i},1)">↓</button></div></div>`}).join('')}</div>`:empty('Your syllabus is empty. Add your own subjects or load editable sample data.',`<button class="bt" onclick="addSubject()">Add subject</button> <button class="bt g2" onclick="loadSample()">Load sample syllabus</button>`)}`}
function vQuests(){const Q=quests(),cats=['Daily','Weekly','Chapter','Revision','Practice','Boss Battle','Milestone'];
return`<div class="row sp"><h1>Quests</h1><button class="bt" onclick="addQuest()">+ Custom quest</button></div><p class="mu">Quest XP is a bonus on top of activity XP (chapter +${CFG.xp.chapter}, revision +${CFG.xp.revision}). Each quest pays once, recorded in a ledger — re-clicking never pays twice.</p>
${cats.map(c=>{const l=Q.filter(k=>k.cat===c);return l.length?`<h2>${c}</h2><div class="grid" style="margin-bottom:16px">${l.map(k=>`<div class="card"><div class="row sp"><b>${esc(k.title)}</b><span class="tag v">+${k.xp} XP</span></div><small>${esc(k.desc)}</small><div class="row" style="margin-top:8px"><span class="tag ${k.st==='done'?'ok':k.st==='ready'?'wn':''}">${{done:'Completed '+(S.claimed[k.id]?fmt(S.claimed[k.id]):''),ready:'Ready to claim',started:'Started',open:'Available'}[k.st]}</span>${k.st==='open'?`<button class="bt g2 sm" onclick="startQ('${k.id}')">Start</button>`:''}${k.st==='ready'?`<button class="bt sm" onclick="claim('${k.id}')">Claim</button>`:''}${k.sub==='x'&&k.st!=='done'&&!k.met?`<button class="bt sm" onclick="doneQ('${k.id.slice(2)}')">Mark done</button>`:''}</div></div>`).join('')}</div>`:''}).join('')}
<h2>History</h2><div class="card">${Object.keys(S.claimed).length?S.xp.filter(x=>x.key.startsWith('quest:')).reverse().map(x=>`<div class="row sp"><span>${esc(x.label)}</span><small>+${x.amt} XP · ${fmt(x.date)}</small></div>`).join(''):'<span class="mu">No completed quests yet.</span>'}</div>`}
function vRev(){const T=[['due','Due today'],['over','Overdue'],['up','Upcoming'],['done','Completed'],['all','All']];const l=S.revs.filter(r=>RT==='all'||rst(r)===RT).sort((a,b)=>a.due<b.due?-1:1);
return`<h1>Revision Centre</h1><p class="mu">Suggested gaps (${CFG.intervals.join(', ')} days) are only suggestions — pick any date that suits your preparation. They do not guarantee retention.</p><div class="tabs" role="tablist">${T.map(t=>`<button class="${RT===t[0]?'on':''}" role="tab" onclick="RT='${t[0]}';R()">${t[1]} (${S.revs.filter(r=>t[0]==='all'||rst(r)===t[0]).length})</button>`).join('')}</div>
${l.length?l.map(r=>{const f=findCh(r.cid);if(!f)return'';const s=rst(r);return`<div class="card row sp"><div><b>${esc(f.c.name)}</b> <span class="tag">#${r.n}</span><br><small>${esc(f.s.name)} · ${r.done?'Done '+fmt(r.doneOn)+' · confidence '+r.conf+'/5':'Due '+fmt(r.due)}</small></div><div class="row"><span class="tag ${{over:'er',due:'wn',done:'ok',up:'v'}[s]}">${{over:'Overdue',due:'Due today',done:'Completed',up:'Upcoming'}[s]}</span>${r.done?'':`<button class="bt sm" onclick="doRev('${r.id}')">Complete</button><button class="bt g2 sm" onclick="resched('${r.id}')">Reschedule</button>`}</div></div>`}).join(''):empty('Nothing here.',chs().length?'Schedule a revision from a chapter in My Syllabus (Revise button).':`<button class="bt" onclick="nav('syl')">Build your syllabus</button>`)}`}
function vAch(){return`<h1>Achievements</h1><div class="grid">${ACH.map(a=>{const d=S.ach[a[0]];return`<div class="card ach ${d?'on':''}"><div class="ic" aria-hidden="true">${a[3]}</div><b>${a[1]}</b><br><small>${a[2]}</small><br><span class="tag ${d?'ok':''}">${d?'Unlocked '+fmt(d):'Locked'}</span></div>`}).join('')}</div>`}
function vProf(){const L=lv(),nr=nextRank(L.l);return`<h1>Profile & Settings</h1><div class="card"><div class="row" style="flex-wrap:nowrap;gap:14px">${rankBadge(L.rank,L.l)}<h3>${esc(S.profile.name)} — ${L.rank}</h3></div><p class="mu">Rank thresholds (by level): ${CFG.ranks.map(r=>r[1]+' ≥ '+r[0]).join(' · ')}.${nr?' Next: '+nr[1]+' at level '+nr[0]+'.':''} Level n needs ${CFG.base}×(n−1)² XP. XP is never deducted for missed days.</p>
<button class="bt" onclick="editProfile()">Edit profile</button></div>
<div class="card"><h3>Account & leaderboard</h3><p class="mu">${UID?'Signed in with your Claude account. Your progress follows you across devices.':'Guest mode — sign in to sync progress and join the peer leaderboard.'}</p><label style="display:flex;gap:8px;align-items:center;margin:8px 0"><input type="checkbox" style="width:auto" ${S.profile.lb?'checked':''} ${UID?'':'disabled'} onchange="setLB(this.checked)"> Show me on the leaderboard (nickname, streak and today's study time only)</label><div class="row">${UID?'<button class="bt g2" onclick="signOut()">Sign out</button>':'<button class="bt" onclick="signIn()">Sign in</button>'}</div></div><div class="card"><h3>Data</h3><p class="mu">${UID?'Your progress is saved in this browser and synced to your private account storage, which other users cannot read.':'Guest mode: data stays only in this browser (localStorage); clearing site data erases it.'} Use export to back up.</p><div class="row"><button class="bt g2" onclick="exportData()">Export JSON</button><button class="bt dn" onclick="resetAll()">Delete all data</button></div></div>
<div class="card"><h3>Not in this version</h3><p class="mu">Mock tests (removed for now), analytics page, calendar, dedicated weak-chapter page, and notifications are not built yet; due revisions appear in-app only.</p></div>`}
function editProfile(){const p=S.profile;form('Edit profile',[{n:'name',l:'Display name',x:'required maxlength=40'},{n:'q',l:'Qualification',t:'select',o:[['CA Final','CA Final'],['x1','CA Intermediate (coming soon)'],['x2','CA Foundation (coming soon)']]},{n:'target',l:'Target exam date',t:'date'},{n:'daily',l:'Daily study target (hours)',t:'number',x:'min=0 max=24 step=0.5'},{n:'goal',l:'Study goal',t:'textarea'}],{...p,q:'CA Final'},d=>{if(!d.name.trim())return'Name required';if(d.q!=='CA Final')return'Only CA Final is available right now';act(()=>Object.assign(p,{name:d.name.trim(),target:d.target,daily:d.daily,goal:d.goal}))})}
const VIEWS={dash:['Dashboard','◈',vDash],syl:['My Syllabus','▤',vSyl],quests:['Quests','⚔',vQuests],rev:['Revision','↻',vRev],time:['Study Time','◷',vTime],lb:['Leaderboard','♛',vLb],ach:['Achievements','✦',vAch],prof:['Profile','⚙',vProf]};
function onboard(){$('#app').innerHTML=`<div class="ob">${logo}<h1>Your journey. Your quest. Your rise.</h1><p class="mu">Make the syllabus conquerable. ARISE turns CA Final preparation into quests, XP and ranks.</p>
<form class="card" id="of"><label>Display name<input name="name" maxlength="40" placeholder="e.g. Aarav"></label><label>Qualification<select name="q"><option>CA Final</option></select></label><label>Target exam date (optional)<input type="date" name="target"></label><label>Daily study target in hours (optional)<input type="number" name="daily" min="0" max="24" step="0.5"></label><label>Study goal (optional)<input name="goal" maxlength="120"></label>
<label>Where are you?<select name="mode"><option value="fresh">Starting fresh</option><option value="cont">Continuing my preparation</option></select></label><label><input type="checkbox" name="sample" style="width:auto"> Load editable sample subjects (not the official syllabus)</label><label style="display:flex;gap:8px;align-items:flex-start"><input type="checkbox" name="lb" checked style="width:auto;margin-top:4px"> Show my nickname, streak and today's study time on the peer leaderboard (nothing else is shared)</label><button class="bt" style="width:100%;margin-top:8px">Begin</button></form>
</div>`;
$('#of').onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));S=blank({name:d.name.trim()||'Student',qual:'CA Final',target:d.target,daily:d.daily,goal:d.goal,mode:d.mode,lb:!!d.lb});S.uid=PENDING;PENDING=null;if(d.sample)loadSample();save();V='dash';startLB();R()}}
function R(){if(!S)return PENDING?onboard():signInScreen();const sc=scrollY;$('#app').innerHTML=`<nav aria-label="Main">${logo}${Object.entries(VIEWS).map(([k,v])=>`<button class="${V===k?'on':''}" ${V===k?'aria-current="page"':''} onclick="nav('${k}')"><span aria-hidden="true">${v[1]}</span>${v[0]}</button>`).join('')}<div class="sy" id="sy">${syncTxt()}</div></nav><main>${VIEWS[V][2]()}</main>${tmBar()}`;scrollTo(0,sc)}
function tmBar(){if(!S.timer)return'';const f=findCh(S.timer.cid);if(!f){S.timer=null;save();return''}return`<div class="tm" role="timer" aria-label="Study timer"><span>⏱ ${esc(f.c.name)}</span><b id="tt">${clock(elapsed())}</b><button class="bt sm" onclick="stopTimer()">Stop & save</button><button class="bt g2 sm" onclick="confirmD('Discard this running session without saving?',()=>stopTimer(1))">Discard</button></div>`}
setInterval(()=>{const e=$('#tt');if(e&&S&&S.timer)e.textContent=clock(elapsed())},1000);
if(S){R();if(S.uid)resume()}else R();
</script></body></html>
